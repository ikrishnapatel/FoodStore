global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'foodstore-docker-cluster'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app-1:8081']
        labels:
          instance_name: 'instance-1'
      - targets: ['app-2:8081']
        labels:
          instance_name: 'instance-2'
      - targets: ['app-3:8081']
        labels:
          instance_name: 'instance-3'

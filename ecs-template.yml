AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to deploy Foodstore API on AWS ECS Fargate referencing an existing Secrets Manager Secret'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Select the VPC where the ECS service should run.
  
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select at least two subnets (preferably public or private with NAT) for the ECS tasks.

  EcrImageUri:
    Type: String
    Default: '272694330898.dkr.ecr.us-east-1.amazonaws.com/app-3107dev/foodstore:latest'
    Description: The URI of the ECR image.

  DbUrl:
    Type: String
    Default: 'jdbc:postgresql://foodstore-db-server.cluster-ci7omoswsvgf.us-east-1.rds.amazonaws.com:5432/foodstoredb'
    Description: The JDBC connection string to the PostgreSQL database.

  DbSecretArn:
    Type: String
    Description: The ARN of the existing AWS Secrets Manager secret holding the database credentials (keys must be 'username' and 'password').

Resources:
  # 1. ECS Cluster
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: foodstore-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/foodstore-api
      RetentionInDays: 7

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2010-09-09'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: EcsGetSecretsPolicy
          PolicyDocument:
            Version: '2010-09-09'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DbSecretArn

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2010-09-09'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Path: /

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Access control for Foodstore ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: foodstore-task
      Cpu: '512'       
      Memory: '1024'  
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref EcsExecutionRole
      TaskRoleArn: !Ref EcsTaskRole
      ContainerDefinitions:
        - Name: foodstore-app
          Image: !Ref EcrImageUri
          Cpu: 512
          Memory: 1024
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: DB_URL
              Value: !Ref DbUrl
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub '${DbSecretArn}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${DbSecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs

  EcsService:
    Type: AWS::ECS::Service 
    Properties:
      ServiceName: foodstore-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref EcsSecurityGroup
          Subnets: !Ref SubnetIds

Outputs:
  ClusterName:
    Value: !Ref EcsCluster
  ServiceName:
    Value: !Ref EcsService

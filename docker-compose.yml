version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: foodstore-db
    environment:
      POSTGRES_DB: foodstoredb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - foodstore-network

  app:
    build: .
    container_name: foodstore-app
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/foodstoredb
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - foodstore-network

volumes:
  postgres-data:

networks:
  foodstore-network:
    driver: bridge

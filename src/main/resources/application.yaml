spring:
  application:
    name: Bookstore

server:
  port: 8081

  services:
    jenkins:
      build: .
      container_name: ecstatic_engelbart_v2
      user: root
      privileged: true
      ports:
        - "8081:8080"
        - "50000:50000"
      volumes:
        - jenkins_home_data:/var/jenkins_home
        - /var/run/docker.sock:/var/run/docker.sock

  volumes:
    jenkins_home_data:
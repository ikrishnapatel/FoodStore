spring:
  application:
    name: Bookstore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookstoredb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
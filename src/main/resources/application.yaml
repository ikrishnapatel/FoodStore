spring:
  application:
    name: Bookstore
  datasource:
    url: ${DB_URL:jdbc:postgresql://bookstore-db-server.cluster-ci7omoswsvgf.us-east-1.rds.amazonaws.com:5432/bookstoredb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:somepostgrespa}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081